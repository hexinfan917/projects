version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: petway-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: petway
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - /etc/localtime:/etc/localtime:ro
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4
    restart: always
    networks:
      - petway-network

  redis:
    image: redis:7-alpine
    container_name: petway-redis
    environment:
      - APP_ENV=production
      - TZ=Asia/Shanghai
    volumes:
      - redis_data:/data
      - /etc/localtime:/etc/localtime:ro
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    restart: always
    networks:
      - petway-network

  user-service:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_NAME: user-service
    image: petway/user-service:latest
    container_name: petway-user-service
    environment:
      - DB_HOST=mysql
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - WECHAT_APPID=${WECHAT_APPID}
      - WECHAT_APPSECRET=${WECHAT_APPSECRET}
      - APP_ENV=production
      - TZ=Asia/Shanghai
    volumes:
      - /etc/localtime:/etc/localtime:ro
    restart: always
    networks:
      - petway-network

  route-service:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_NAME: route-service
    image: petway/route-service:latest
    container_name: petway-route-service
    environment:
      - DB_HOST=mysql
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - FILE_SERVICE_URL=http://petway-file-service:8000
      - APP_ENV=production
      - TZ=Asia/Shanghai
    volumes:
      - /etc/localtime:/etc/localtime:ro
    restart: always
    networks:
      - petway-network

  order-service:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_NAME: order-service
    image: petway/order-service:latest
    container_name: petway-order-service
    environment:
      - DB_HOST=mysql
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - PAY_SERVICE_URL=http://petway-pay-service:8000
      - APP_ENV=production
      - TZ=Asia/Shanghai
    volumes:
      - /etc/localtime:/etc/localtime:ro
    restart: always
    networks:
      - petway-network

  content-service:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_NAME: content-service
    image: petway/content-service:latest
    container_name: petway-content-service
    environment:
      - DB_HOST=mysql
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - APP_ENV=production
      - TZ=Asia/Shanghai
    volumes:
      - /etc/localtime:/etc/localtime:ro
    restart: always
    networks:
      - petway-network

  map-service:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_NAME: map-service
    image: petway/map-service:latest
    container_name: petway-map-service
    environment:
      - DB_HOST=mysql
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    restart: always
    networks:
      - petway-network

  message-service:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_NAME: message-service
    image: petway/message-service:latest
    container_name: petway-message-service
    environment:
      - DB_HOST=mysql
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    restart: always
    networks:
      - petway-network

  file-service:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_NAME: file-service
    image: petway/file-service:latest
    container_name: petway-file-service
    environment:
      - DB_HOST=mysql
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - UPLOAD_DIR=/app/uploads
      - APP_ENV=production
      - TZ=Asia/Shanghai
    volumes:
      - /opt/petway/backend/file-service/uploads:/app/uploads
      - /etc/localtime:/etc/localtime:ro
    restart: always
    networks:
      - petway-network

  pay-service:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_NAME: pay-service
    image: petway/pay-service:latest
    container_name: petway-pay-service
    environment:
      - DB_HOST=mysql
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - ORDER_SERVICE_URL=http://petway-order-service:8000
      - WECHAT_APPID=${WECHAT_APPID}
      - WECHAT_MCHID=${WECHAT_MCHID}
      - WECHAT_APIKEY=${WECHAT_APIKEY}
      - WECHAT_NOTIFY_URL=https://tailtravel.cn/api/v1/pay/notify
      - WECHAT_PAY_SANDBOX=${WECHAT_PAY_SANDBOX:-false}
      - WECHAT_CERT_PATH=/app/certs/apiclient_cert.pem
      - WECHAT_KEY_PATH=/app/certs/apiclient_key.pem
      - WECHAT_CERT_SERIAL_NO=578981595A43F2E58B46B5C4416E53937C7C5659
      - APP_ENV=production
      - TZ=Asia/Shanghai
    volumes:
      - /opt/petway/certs:/app/certs
      - /etc/localtime:/etc/localtime:ro
    restart: always
    networks:
      - petway-network

  charity-service:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_NAME: charity-service
    image: petway/charity-service:latest
    container_name: petway-charity-service
    environment:
      - DB_HOST=mysql
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    restart: always
    networks:
      - petway-network

  gateway:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_NAME: gateway
    image: petway/gateway:latest
    container_name: petway-gateway
    ports:
      - "8000:8000"
    environment:
      - DOCKER_MODE=true
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - APP_ENV=production
      - TZ=Asia/Shanghai
    volumes:
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - user-service
      - route-service
      - order-service
      - content-service
      - map-service
      - message-service
      - file-service
      - charity-service
    restart: always
    networks:
      - petway-network

volumes:
  mysql_data:
  redis_data:

networks:
  petway-network:
    driver: bridge
