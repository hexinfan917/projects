version: '3.8'

services:
  # MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: petway-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: petway
      MYSQL_USER: petway
      MYSQL_PASSWORD: petway123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../database/migrations:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: petway-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  # 用户服务
  user-service:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_NAME: user-service
    container_name: petway-user-service
    environment:
      - SERVICE_NAME=user-service
      - DB_HOST=mysql
      - DB_PASSWORD=petway123
      - REDIS_HOST=redis
    ports:
      - "8001:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ../../backend/common:/app/common
      - ../../backend/user-service:/app/service
    command: python -m uvicorn service.main:app --host 0.0.0.0 --port 8000 --reload

  # 路线服务
  route-service:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_NAME: route-service
    container_name: petway-route-service
    environment:
      - SERVICE_NAME=route-service
      - DB_HOST=mysql
      - DB_PASSWORD=petway123
      - REDIS_HOST=redis
    ports:
      - "8002:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ../../backend/common:/app/common
      - ../../backend/route-service:/app/service
    command: python -m uvicorn service.main:app --host 0.0.0.0 --port 8000 --reload

  # 订单服务
  order-service:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_NAME: order-service
    container_name: petway-order-service
    environment:
      - SERVICE_NAME=order-service
      - DB_HOST=mysql
      - DB_PASSWORD=petway123
      - REDIS_HOST=redis
    ports:
      - "8003:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ../../backend/common:/app/common
      - ../../backend/order-service:/app/service
    command: python -m uvicorn service.main:app --host 0.0.0.0 --port 8000 --reload

  # 支付服务
  pay-service:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_NAME: pay-service
    container_name: petway-pay-service
    environment:
      - SERVICE_NAME=pay-service
      - DB_HOST=mysql
      - DB_PASSWORD=petway123
      - REDIS_HOST=redis
    ports:
      - "8006:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ../../backend/common:/app/common
      - ../../backend/pay-service:/app/service
    command: python -m uvicorn service.main:app --host 0.0.0.0 --port 8000 --reload

  # 内容服务
  content-service:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_NAME: content-service
    container_name: petway-content-service
    environment:
      - SERVICE_NAME=content-service
      - DB_HOST=mysql
      - DB_PASSWORD=petway123
      - REDIS_HOST=redis
    ports:
      - "8005:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ../../backend/common:/app/common
      - ../../backend/content-service:/app/service
    command: python -m uvicorn service.main:app --host 0.0.0.0 --port 8000 --reload

  # 地图服务
  map-service:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_NAME: map-service
    container_name: petway-map-service
    environment:
      - SERVICE_NAME=map-service
      - DB_HOST=mysql
      - DB_PASSWORD=petway123
      - REDIS_HOST=redis
    ports:
      - "8004:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ../../backend/common:/app/common
      - ../../backend/map-service:/app/service
    command: python -m uvicorn service.main:app --host 0.0.0.0 --port 8000 --reload

  # 消息服务
  message-service:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_NAME: message-service
    container_name: petway-message-service
    environment:
      - SERVICE_NAME=message-service
      - DB_HOST=mysql
      - DB_PASSWORD=petway123
      - REDIS_HOST=redis
    ports:
      - "8007:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ../../backend/common:/app/common
      - ../../backend/message-service:/app/service
    command: python -m uvicorn service.main:app --host 0.0.0.0 --port 8000 --reload

  # 文件服务
  file-service:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_NAME: file-service
    container_name: petway-file-service
    environment:
      - SERVICE_NAME=file-service
      - DB_HOST=mysql
      - DB_PASSWORD=petway123
      - REDIS_HOST=redis
    ports:
      - "8008:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ../../backend/common:/app/common
      - ../../backend/file-service:/app/service
      - file_uploads:/app/uploads
    command: python -m uvicorn service.main:app --host 0.0.0.0 --port 8000 --reload

  # 公益服务
  charity-service:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_NAME: charity-service
    container_name: petway-charity-service
    environment:
      - SERVICE_NAME=charity-service
      - DB_HOST=mysql
      - DB_PASSWORD=petway123
      - REDIS_HOST=redis
    ports:
      - "8009:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ../../backend/common:/app/common
      - ../../backend/charity-service:/app/service
    command: python -m uvicorn service.main:app --host 0.0.0.0 --port 8000 --reload

  # API网关
  gateway:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_NAME: gateway
    container_name: petway-gateway
    environment:
      - SERVICE_NAME=gateway
      - DB_HOST=mysql
      - DB_PASSWORD=petway123
      - REDIS_HOST=redis
      - REDIS_PASSWORD=petway123
      - JWT_SECRET=petway_jwt_secret_key_2024_change_me_at_least_32_chars
    ports:
      - "8000:8000"
    depends_on:
      - user-service
      - route-service
      - order-service
      - pay-service
      - content-service
      - map-service
      - message-service
      - file-service
      - charity-service
    volumes:
      - ../../backend/common:/app/common
      - ../../backend/gateway:/app/service
    command: python -m uvicorn service.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  mysql_data:
  redis_data:
  file_uploads:
